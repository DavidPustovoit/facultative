<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Авторизація - Факультатив</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #5cb85c; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #4cae4c; }
        .error { color: #d9534f; margin-bottom: 10px; }
        .success { color: #5cb85c; margin-bottom: 10px; }
        .link { display: block; margin-top: 15px; color: #337ab7; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Вхід до системи</h2>
    <div th:if="${param.error}" class="error">Невірний логін або пароль</div>
    <div th:if="${param.success}" class="success">Реєстрація успішна! Увійдіть</div>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Логін" required autofocus>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Увійти</button>
    </form>
    <a href="/register" class="link">Створити новий обліковий запис</a>
</div>
</body>
</html>
