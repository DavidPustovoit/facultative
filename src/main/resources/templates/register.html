<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація - Факультатив</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #337ab7; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #286090; }
        .link { display: block; margin-top: 15px; color: #337ab7; text-decoration: none; }
    </style>
</head>
<body>
<div class="register-box">
    <h2>Реєстрація у системі</h2>
    <form th:action="@{/register}" method="post">
        <input type="text" name="fullName" placeholder="Повне ім'я та прізвище" required>
        <input type="text" name="username" placeholder="Вигадайте логін" required>
        <input type="password" name="password" placeholder="Вигадайте пароль" required>
        <button type="submit">Зареєструватися</button>
    </form>
    <a href="/login" class="link">Вже є обліковий запис? Увійти</a>
</div>
</body>
</html>
